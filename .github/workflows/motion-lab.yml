name: Motion Lab

on:
  workflow_dispatch:
  push:
    branches: [codex/motion-lab]
    paths:
      - 'experiments/ZhijianMotionLab/**'
      - '.github/workflows/motion-lab.yml'

concurrency:
  group: motion-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prototype:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    defaults:
      run:
        working-directory: experiments/ZhijianMotionLab
    steps:
      - uses: actions/checkout@v5
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate isolated project
        run: xcodegen generate
      - name: Select and boot simulator
        run: |
          set -euo pipefail
          RUNTIME_ID="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["version"].startswith("26.")))')"
          DEVICE_ID="$(xcrun simctl create ZhijianMotionLab com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro "$RUNTIME_ID")"
          echo "LAB_DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time '9:41' --batteryState charged --batteryLevel 100
          xcodebuild -version | tee toolchain.log
      - name: Test actual simulator build and journey
        run: |
          set -euo pipefail
          xcodebuild -project ZhijianMotionLab.xcodeproj -scheme ZhijianMotionLab \
            -destination "id=$LAB_DEVICE_ID" -derivedDataPath build/Simulator \
            CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO \
            -only-testing:ZhijianMotionLabTests \
            -only-testing:ZhijianMotionLabUITests/LabJourneyTests/testIntroCanSwipeForwardAndBackwardWithoutContinueButton \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180 \
            -resultBundlePath MotionLab.xcresult test 2>&1 | tee simulator-test.log
      - name: Export screenshots
        if: always()
        run: |
          if [ -d MotionLab.xcresult ]; then
            xcrun xcresulttool export attachments --path MotionLab.xcresult --output-path evidence/screenshots
            mkdir -p evidence/previews
            sips --help > evidence/sips-help.txt
            grep -q -- '--resampleHeightWidthMax' evidence/sips-help.txt
            cp evidence/screenshots/manifest.json evidence/previews/
            for SCREENSHOT in evidence/screenshots/*.png; do
              [ -f "$SCREENSHOT" ] || continue
              BASENAME="$(basename "$SCREENSHOT" .png)"
              sips -Z 1280 -s format jpeg -s formatOptions 70 "$SCREENSHOT" --out "evidence/previews/$BASENAME.jpg" > /dev/null
            done
          fi
      - name: Record actual swipe-driven reading journey
        run: |
          set -euo pipefail
          mkdir -p evidence
          xcrun simctl io "$LAB_DEVICE_ID" recordVideo --codec=h264 build/native-swipes.mp4 > evidence/recording.log 2>&1 &
          RECORD_PID=$!
          trap 'kill -INT "$RECORD_PID" 2>/dev/null || true' EXIT
          set +e
          xcodebuild -project ZhijianMotionLab.xcodeproj -scheme ZhijianMotionLab \
            -destination "id=$LAB_DEVICE_ID" -derivedDataPath build/Simulator \
            CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO \
            -only-testing:ZhijianMotionLabUITests/LabJourneyTests/testReadingJourneyUsesRealSwipesLiveControlsAndSavedQuotes \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180 \
            -resultBundlePath InteractiveJourney.xcresult test 2>&1 | tee interactive-test.log
          TEST_EXIT=$?
          set -e
          kill -INT "$RECORD_PID"
          wait "$RECORD_PID" || true
          trap - EXIT
          if [ "$TEST_EXIT" -ne 0 ]; then exit "$TEST_EXIT"; fi
          avconvert --help > evidence/avconvert-help.txt 2>&1 || true
          if grep -q 'Preset960x540' evidence/avconvert-help.txt; then
            if ! avconvert --source build/native-swipes.mp4 --preset Preset960x540 --output evidence/reading-swipes.mp4 > evidence/avconvert.log 2>&1; then
              echo 'Preview conversion unavailable; retaining the original native capture.'
              cp build/native-swipes.mp4 evidence/reading-swipes.mp4
            fi
          else
            cp build/native-swipes.mp4 evidence/reading-swipes.mp4
          fi
          shasum -a 256 build/native-swipes.mp4 evidence/reading-swipes.mp4 > evidence/capture-sha256.txt
          test -s evidence/reading-swipes.mp4
      - name: Export live reading journey screenshots
        if: always()
        run: |
          if [ -d InteractiveJourney.xcresult ]; then
            xcrun xcresulttool export attachments --path InteractiveJourney.xcresult --output-path evidence/interactive-screenshots
            mkdir -p evidence/interactive-previews
            cp evidence/interactive-screenshots/manifest.json evidence/interactive-previews/
            for SCREENSHOT in evidence/interactive-screenshots/*.png; do
              [ -f "$SCREENSHOT" ] || continue
              BASENAME="$(basename "$SCREENSHOT" .png)"
              sips -Z 1280 -s format jpeg -s formatOptions 70 "$SCREENSHOT" --out "evidence/interactive-previews/$BASENAME.jpg" > /dev/null
            done
          fi
      - name: Build unsigned isolated device app
        run: |
          set -euo pipefail
          xcodebuild -project ZhijianMotionLab.xcodeproj -scheme ZhijianMotionLab \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/Device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee device-build.log
          mkdir -p build/package/Payload
          cp -R build/Device/Build/Products/Release-iphoneos/ZhijianMotionLab.app build/package/Payload/
          ditto -c -k --keepParent build/package/Payload ZhijianMotionLab-0.1.0-build3-unsigned.ipa
          shasum -a 256 ZhijianMotionLab-0.1.0-build3-unsigned.ipa | tee evidence/ipa-sha256.txt
      - name: Preserve failure excerpts
        if: failure()
        run: |
          grep -E 'error:|Test Case.*failed|TEST FAILED|BUILD FAILED' simulator-test.log interactive-test.log device-build.log 2>/dev/null | tail -n 60 || true
      - name: Upload independent test IPA
        uses: actions/upload-artifact@v4
        with:
          name: motion-lab-ipa-${{ github.sha }}
          path: experiments/ZhijianMotionLab/*.ipa
          retention-days: 14
          if-no-files-found: error
      - name: Upload visual and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-lab-evidence-${{ github.sha }}
          path: |
            experiments/ZhijianMotionLab/evidence
            experiments/ZhijianMotionLab/*test.log
            experiments/ZhijianMotionLab/*build.log
            experiments/ZhijianMotionLab/toolchain.log
          retention-days: 14
      - name: Upload lightweight native previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-lab-preview-${{ github.sha }}
          path: |
            experiments/ZhijianMotionLab/evidence/previews
            experiments/ZhijianMotionLab/evidence/interactive-previews
          retention-days: 14
