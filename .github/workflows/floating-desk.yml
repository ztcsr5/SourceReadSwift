name: Floating Reading Desk

on:
  push:
    branches: [codex/floating-reading-desk]
  workflow_dispatch:

concurrency:
  group: floating-desk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: '18.'
            runner: macos-15-intel
            xcode: Xcode_16.4.app
            name: compatibility
          - runtime: '26.'
            runner: macos-26-intel
            xcode: Xcode_26.2.app
            name: liquid-glass
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/${{ matrix.xcode }}/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Boot the requested runtime
        timeout-minutes: 25
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list runtimes -j > runtimes.json
          RUNTIME_ID="$(python3 -c 'import json; print(next(r["identifier"] for r in json.load(open("runtimes.json"))["runtimes"] if r.get("isAvailable") and r["version"].startswith("${{ matrix.runtime }}")))')"
          python3 -u scripts/boot_native_simulator.py "$RUNTIME_ID" --output desk-device.txt 2>&1 | tee desk-boot.log
      - name: Compile real app and tests
        timeout-minutes: 35
        run: |
          set -euo pipefail
          DEVICE_ID="$(cat desk-device.txt)"
          xcodebuild -project SourceReadSwift.xcodeproj -scheme SourceReadSwift \
            -destination "id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO \
            build-for-testing 2>&1 | tee desk-build.log
      - name: Run unit and mounted visual regressions
        timeout-minutes: 20
        run: |
          set -euo pipefail
          DEVICE_ID="$(cat desk-device.txt)"
          TESTS=(-only-testing:SourceReadSwiftTests)
          if [ "${{ matrix.name }}" = "liquid-glass" ]; then
            TESTS=(-only-testing:SourceReadSwiftTests/FloatingReadingDeskTests \
              -only-testing:SourceReadSwiftTests/Release117ReadingHeroTests \
              -only-testing:SourceReadSwiftTests/Release117MotionSystemTests \
              -only-testing:SourceReadSwiftTests/Release117PolishTests \
              -only-testing:SourceReadSwiftTests/TabChromeRegressionTests \
              -only-testing:SourceReadSwiftTests/AppFrameProfilerTests \
              -only-testing:SourceReadSwiftTests/ContentImagePipelineRegressionTests)
          fi
          xcodebuild -project SourceReadSwift.xcodeproj -scheme SourceReadSwift \
            -destination "id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO \
            "${TESTS[@]}" -test-timeouts-enabled YES -maximum-test-execution-time-allowance 60 \
            -resultBundlePath DeskUnit.xcresult test-without-building 2>&1 | tee desk-unit.log
      - name: Record real home gestures navigation and performance
        timeout-minutes: 15
        run: |
          set -euo pipefail
          DEVICE_ID="$(cat desk-device.txt)"
          xcrun simctl io "$DEVICE_ID" recordVideo --codec=h264 desk-motion.mp4 > desk-video.log 2>&1 &
          VIDEO_PID=$!
          trap 'kill -INT "$VIDEO_PID" 2>/dev/null || true; wait "$VIDEO_PID" || true' EXIT
          xcodebuild -project SourceReadSwift.xcodeproj -scheme SourceReadSwift \
            -destination "id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180 \
            -resultBundlePath DeskUI.xcresult test-without-building 2>&1 | tee desk-ui.log
      - name: Export real app screenshots
        if: always()
        run: |
          if [ -d DeskUnit.xcresult ]; then
            xcrun xcresulttool export attachments --path DeskUnit.xcresult --output-path desk-snapshots/unit
          fi
          if [ -d DeskUI.xcresult ]; then
            xcrun xcresulttool export attachments --path DeskUI.xcresult --output-path desk-snapshots/ui
          fi
      - name: Preserve compact visual and motion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floating-desk-${{ matrix.name }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            desk-*.log
            runtimes.json
            desk-motion.mp4
            desk-snapshots
          retention-days: 7
      - name: Preserve XCTest metrics and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floating-desk-xcresult-${{ matrix.name }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            DeskUnit.xcresult
            DeskUI.xcresult
          retention-days: 7
