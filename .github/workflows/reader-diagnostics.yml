name: Reader Failure Diagnostics
run-name: "SourceRead 1.1.8 · Build 138 · 关键失败定向验证（非 IPA 门禁） · #${{ github.run_number }}"
on:
  workflow_dispatch:
    inputs:
      navigation_only:
        description: Compare return input and in-app readiness on sequential runtime runners
        type: boolean
        default: true
      ios26_only:
        description: Limit a runtime-specific reproduction to iOS 26 without changing release gates
        type: boolean
        default: false
      zoom_experiment:
        description: Run only the three-condition Zoom experiment and independent WebKit positioning regression
        type: boolean
        default: false
      unit_only:
        description: Diagnose transport and theme changes without repeating already-passed UI flows
        type: boolean
        default: true
      targeted_paths:
        description: Run only the two previously failing navigation UI cases, isolated from the full UI batch
        type: boolean
        default: false
concurrency:
  group: reader-diagnostics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused-ios26:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        runtime: ${{ inputs.navigation_only && !inputs.ios26_only && fromJSON('["26", "18"]') || fromJSON('["26"]') }}
    runs-on: ${{ matrix.runtime == '26' && 'macos-26' || 'macos-15' }}
    timeout-minutes: 65
    env:
      DEVELOPER_DIR: ${{ matrix.runtime == '26' && '/Applications/Xcode_26.2.app/Contents/Developer' || '/Applications/Xcode_16.4.app/Contents/Developer' }}
      DIAGNOSTIC_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v5
      - name: Generate project
        run: |
          brew install xcodegen
          if [ "${{ inputs.zoom_experiment }}" = "true" ]; then
            cp scripts/fixtures/ReaderZoomExperimentUITests.swift SourceReadSwiftUITests/
          fi
          xcodegen generate
      - name: Boot diagnostic simulator
        timeout-minutes: 20
        run: |
          set -euo pipefail
          RUNTIME_ID="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys,os; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["version"].startswith(os.environ["DIAGNOSTIC_RUNTIME"]+".")))')"
          python3 -u scripts/boot_native_simulator.py "$RUNTIME_ID" --output diagnostic-device.txt 2>&1 | tee diagnostic-boot.log
      - name: Compile app and tests
        id: build
        timeout-minutes: 20
        run: |
          set -euo pipefail
          DEVICE_ID="$(cat diagnostic-device.txt)"
          xcodebuild -project SourceReadSwift.xcodeproj -scheme SourceReadSwift -destination "id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO build-for-testing 2>&1 | tee diagnostic-build.log
      - name: Verify transport focus and return policies
        if: ${{ !inputs.navigation_only && !inputs.zoom_experiment }}
        timeout-minutes: 8
        env:
          TEST_RUNNER_SOURCE_READ_COMIC_DIAGNOSTICS: "1"
        run: |
          set -euo pipefail
          DEVICE_ID="$(cat diagnostic-device.txt)"
          xcodebuild -project SourceReadSwift.xcodeproj -scheme SourceReadSwift -destination "id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO \
            -only-testing:SourceReadSwiftTests/RemoteComicImageTests \
            -only-testing:SourceReadSwiftTests/AtelierThemeTests \
            -only-testing:SourceReadSwiftTests/HomeLayoutEvidenceTests \
            -only-testing:SourceReadSwiftTests/Release116VisualTests \
            -only-testing:SourceReadSwiftTests/ReaderOpeningTransitionTests \
            -only-testing:SourceReadSwiftTests/Release117AppearanceTests \
            -only-testing:SourceReadSwiftTests/Release117MotionSystemTests \
            -only-testing:SourceReadSwiftTests/Release117ThemeCollaborationTests \
            -only-testing:SourceReadSwiftTests/Release117DetailTests \
            -only-testing:SourceReadSwiftTests/ReaderExitSwipeTests \
            -only-testing:SourceReadSwiftTests/GlobalSearchIndexTests \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 60 \
            -resultBundlePath DiagnosticUnit.xcresult test-without-building 2>&1 | tee diagnostic-unit.log
      - name: Verify native reader hosting and export round trips
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.navigation_only && !inputs.zoom_experiment }}
        # 13 unit classes, including 38 theme snapshot renders; 8 min was not enough headroom.
        timeout-minutes: 12
        run: |
          set -euo pipefail
          DEVICE_ID="$(cat diagnostic-device.txt)"
          xcodebuild -project SourceReadSwift.xcodeproj -scheme SourceReadSwift -destination "id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO \
            -only-testing:SourceReadSwiftTests/ReaderNavigationSessionTests \
            -only-testing:SourceReadSwiftTests/ReaderNativeNavigationTests \
            -only-testing:SourceReadSwiftTests/ReaderSafeAreaResolverTests \
            -only-testing:SourceReadSwiftTests/ReaderCompatibilityNavigationTests \
            -only-testing:SourceReadSwiftTests/ReaderModePositionRegressionTests \
            -only-testing:SourceReadSwiftTests/ReaderZoomSourceTests \
            -only-testing:SourceReadSwiftTests/ReaderScrollSchedulingTests \
            -only-testing:SourceReadSwiftTests/ReaderOpeningTransitionTests \
            -only-testing:SourceReadSwiftTests/BookExportRegressionTests \
            -only-testing:SourceReadSwiftTests/LocalEPUBBookParserTests \
            -only-testing:SourceReadSwiftTests/ChapterFetchConcurrencyTests \
            -only-testing:SourceReadSwiftTests/OfflineTextRetentionTests \
            -only-testing:SourceReadSwiftTests/AtelierThemeTests \
            -only-testing:SourceReadSwiftTests/VideoGlassThemeTests \
            -only-testing:SourceReadSwiftTests/ReaderSettingsPageTests \
            -only-testing:SourceReadSwiftTests/TxtChapterRuleLibraryTests \
            -only-testing:SourceReadSwiftTests/SourceCookieStoreTests \
            -only-testing:SourceReadSwiftTests/Release116VisualTests/testThemesChangeGeometryTypographyAndSurfaceNotOnlyAccent \
            -only-testing:SourceReadSwiftTests/Release116VisualTests/testNewThemeDefaultAccentContrastInBothAppearances \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 60 \
            -resultBundlePath DiagnosticUnit.xcresult test-without-building 2>&1 | tee diagnostic-unit.log
      - name: Publish unit feedback before UI
        if: ${{ always() && steps.build.outcome == 'success' && !inputs.zoom_experiment }}
        uses: actions/upload-artifact@v4
        with:
          name: reader-diag-unit-${{ github.sha }}-ios${{ matrix.runtime }}-attempt${{ github.run_attempt }}
          path: diagnostic-unit.log
          if-no-files-found: error
          retention-days: 7
      - name: Reproduce the two failing navigation paths in isolation
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.targeted_paths }}
        # 11 UI cases in one xcodebuild took 1300 s on a cold runner and hit the
        # step cap mid-batch, which made every later failure unattributable.
        # Only these two failed in run 43344641356; run them alone so a red
        # result is evidence instead of resource starvation.
        timeout-minutes: 18
        run: |
          set -euo pipefail
          DEVICE_ID="$(cat diagnostic-device.txt)"
          xcodebuild -project SourceReadSwift.xcodeproj -scheme SourceReadSwift -destination "id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testContinuousChapterCrossingKeepsProseHeadingAndReopenedPositionTogether \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testReadingDeskLongPressOffersTheSameBookActionsWithoutActivatingReader \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 240 \
            -resultBundlePath DiagnosticTargeted.xcresult test-without-building 2>&1 | tee diagnostic-targeted.log
      - name: Verify the failed real navigation paths
        if: ${{ !cancelled() && steps.build.outcome == 'success' && !inputs.unit_only && !inputs.navigation_only && !inputs.zoom_experiment && !inputs.targeted_paths }}
        timeout-minutes: 22
        run: |
          set -euo pipefail
          DEVICE_ID="$(cat diagnostic-device.txt)"
          xcodebuild -project SourceReadSwift.xcodeproj -scheme SourceReadSwift -destination "id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testHomeGlobalSearchOnlyFindsAppFunctions \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testFirstDetailEdgeReturnRestoresInteractiveHomeAndOnlyOneTabBar \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testFirstReadingOpensProseAndLaterResumesDirectly \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testCollapsedShelfFiltersPreserveQueryAndThemeLayoutsHaveRealEntries \
            -only-testing:SourceReadSwiftUITests/ReaderSettingsFlowUITests/testSearchPreviewOpensDirectlyAndOffersToKeepReadingPositionOnExit \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testReaderLongEdgeReturnCompletesWithReducedMotion \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testReaderSystemReturnCanCancelWithoutLosingItsSavedParagraph \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testReaderSystemReturnCanCancelWithReducedMotion \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testContinuousChapterCrossingKeepsProseHeadingAndReopenedPositionTogether \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testReadingDeskLongPressOffersTheSameBookActionsWithoutActivatingReader \
            -only-testing:SourceReadSwiftUITests/ComicPagingBoundaryUITests \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180 \
            -resultBundlePath DiagnosticUI.xcresult test-without-building 2>&1 | tee diagnostic-ui.log
      - name: Compare native cancellation and measured home readiness
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.navigation_only && !inputs.zoom_experiment && !inputs.targeted_paths }}
        # 12 real UI cases measured 630 s on iOS 26; a 10 min cap killed the run mid-case.
        timeout-minutes: 24
        run: |
          set -euo pipefail
          DEVICE_ID="$(cat diagnostic-device.txt)"
          xcodebuild -project SourceReadSwift.xcodeproj -scheme SourceReadSwift -destination "id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testReaderSystemReturnCanCancelWithoutLosingItsSavedParagraph \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testReaderFastNativeReturnCompletesFromProse \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testReaderShortDefaultSpeedEdgeDragCancels \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testNativeReturnCancellationWithImmediateSlowDrag \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testNativeReturnCancellationWithImmediateDefaultDrag \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testNativeReturnCancellationWithLongerSubthresholdDrag \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testFirstDetailEdgeReturnRestoresInteractiveHomeAndOnlyOneTabBar \
            -only-testing:SourceReadSwiftUITests/ReaderSettingsFlowUITests/testBindingsAndAssistanceReturnToSettingsNotTheBookshelf \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testContinueRestoresTheSavedParagraphInTheRealWebView \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testReopeningTheSameBookReusesTheParkedDocumentInTheRealApp \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testDetailCoverSourceSurvivesRepeatedReaderRoundTrips \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180 \
            -resultBundlePath DiagnosticUI.xcresult test-without-building 2>&1 | tee diagnostic-ui.log
      - name: Reproduce repeated native cancellation on iOS26
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.navigation_only && matrix.runtime == '26' && !inputs.zoom_experiment }}
        timeout-minutes: 18
        run: |
          set -euo pipefail
          DEVICE_ID="$(cat diagnostic-device.txt)"
          xcodebuild -project SourceReadSwift.xcodeproj -scheme SourceReadSwift -destination "id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO \
            -only-testing:SourceReadSwiftUITests/ReaderOverlayCycleUITests \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 900 \
            -resultBundlePath DiagnosticCycles.xcresult test-without-building 2>&1 | tee diagnostic-cycles.log
      - name: Verify real viewport positioning independently
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.zoom_experiment }}
        timeout-minutes: 6
        run: |
          set -euo pipefail
          DEVICE_ID="$(cat diagnostic-device.txt)"
          xcodebuild -project SourceReadSwift.xcodeproj -scheme SourceReadSwift -destination "id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO \
            -only-testing:SourceReadSwiftTests/ReaderModePositionRegressionTests/testOpeningWaitsForTheResolvedCursorBeforeMountingAndPresenting \
            -only-testing:SourceReadSwiftTests/ReaderModePositionRegressionTests/testPrefetchBeforeFirstRenderAcknowledgementCannotStrandOpening \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 90 \
            -resultBundlePath DiagnosticUnit.xcresult test-without-building 2>&1 | tee diagnostic-unit.log
      - name: Preserve independent viewport result before gesture experiment
        if: ${{ always() && steps.build.outcome == 'success' && inputs.zoom_experiment }}
        uses: actions/upload-artifact@v4
        with:
          name: reader-diag-unit-${{ github.sha }}-ios${{ matrix.runtime }}-attempt${{ github.run_attempt }}
          path: diagnostic-unit.log
          if-no-files-found: error
          retention-days: 7
      - name: Compare four edge-input scopes on the production WebKit page
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.zoom_experiment }}
        timeout-minutes: 55
        run: |
          set -euo pipefail
          DEVICE_ID="$(cat diagnostic-device.txt)"
          xcodebuild -project SourceReadSwift.xcodeproj -scheme SourceReadSwift -destination "id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO \
            -only-testing:SourceReadSwiftUITests/ReaderZoomExperimentUITests \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 1800 \
            -resultBundlePath DiagnosticCycles.xcresult test-without-building 2>&1 | tee diagnostic-cycles.log
      - name: Export diagnostic attachments
        if: always()
        run: |
          if [ -d DiagnosticUnit.xcresult ]; then
            xcrun xcresulttool export attachments --path DiagnosticUnit.xcresult --output-path diagnostic-snapshots/unit
          fi
          if [ -d DiagnosticUI.xcresult ]; then
            xcrun xcresulttool export attachments --path DiagnosticUI.xcresult --output-path diagnostic-snapshots/ui
          fi
          if [ -d DiagnosticCycles.xcresult ]; then
            xcrun xcresulttool export attachments --path DiagnosticCycles.xcresult --output-path diagnostic-snapshots/cycles
          fi
      - name: Preserve diagnostic logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-diagnostics-${{ github.sha }}-ios${{ matrix.runtime }}-attempt${{ github.run_attempt }}
          path: |
            diagnostic-*.log
            DiagnosticUnit.xcresult
            DiagnosticUI.xcresult
            DiagnosticCycles.xcresult
          retention-days: 7
      - name: Preserve compact visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios26-ui-snapshots-${{ github.sha }}-diagnostics-ios${{ matrix.runtime }}-attempt${{ github.run_attempt }}
          path: diagnostic-snapshots
          retention-days: 7
