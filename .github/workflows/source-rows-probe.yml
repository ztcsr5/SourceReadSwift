name: Source rows probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild \
            -project SourceReadSwift.xcodeproj \
            -scheme SourceReadSwift \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing 2>&1 | tee probe-build.log

      - name: Run source probes
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          TEST_RUNNER_ROWS_PROBE_OUTPUT="$RUNNER_TEMP/rows-probe.json" \
          TEST_RUNNER_TOC_PROBE_OUTPUT="$RUNNER_TEMP/toc-probe.json" \
          xcodebuild \
            -project SourceReadSwift.xcodeproj \
            -scheme SourceReadSwift \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO \
            -only-testing:SourceReadSwiftTests/SourceRowsCorpusProbeTests \
            -only-testing:SourceReadSwiftTests/SourceTocCorpusProbeTests \
            test-without-building 2>&1 | tee probe-test.log

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rows-probe
          path: |
            ${{ runner.temp }}/rows-probe.json
            ${{ runner.temp }}/toc-probe.json
          if-no-files-found: warn