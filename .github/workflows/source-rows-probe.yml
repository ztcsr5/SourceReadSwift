name: Source parser and corpus probes

on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner pool for native source regression
        type: choice
        options: [macos-15, macos-15-intel]
        default: macos-15

jobs:
  probe:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild \
            -project SourceReadSwift.xcodeproj \
            -scheme SourceReadSwift \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing 2>&1 | tee probe-build.log

      - name: Select probe simulator
        id: probe-simulator
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          printf 'device=%s\n' "$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Run offline parser regression
        env:
          DEVICE_ID: ${{ steps.probe-simulator.outputs.device }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project SourceReadSwift.xcodeproj \
            -scheme SourceReadSwift \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO \
            -only-testing:SourceReadSwiftTests/SourceParserBundleCompatibilityTests \
            -only-testing:SourceReadSwiftTests/ChapterListMetadataTests \
            -only-testing:SourceReadSwiftTests/ChapterTextSanitizerTests \
            -only-testing:SourceReadSwiftTests/ContentParserTests \
            -only-testing:SourceReadSwiftTests/SourceEngineFixturePipelineTests \
            -only-testing:SourceReadSwiftTests/SourceEngineDynamicTokenFixtureTests \
            -only-testing:SourceReadSwiftTests/SourceEngineDynamicAjaxFixtureTests \
            -only-testing:SourceReadSwiftTests/SourceEngineCryptoFixtureTests \
            -only-testing:SourceReadSwiftTests/SourceEngineLegadoCorpusTests \
            -only-testing:SourceReadSwiftTests/SourceRequestBuilderDynamicStateTests \
            -only-testing:SourceReadSwiftTests/AggregateSourceRegressionTests \
            -only-testing:SourceReadSwiftTests/LegadoAdvancedJsonSourceTests \
            -only-testing:SourceReadSwiftTests/JSONRuleExtractorTests \
            -only-testing:SourceReadSwiftTests/JSCoreRuntimeTests \
            -only-testing:SourceReadSwiftTests/SearchURLResolverTests \
            -only-testing:SourceReadSwiftTests/SourceURLBodyJSRegressionTests \
            -only-testing:SourceReadSwiftTests/SourceDynamicLoginTests \
            -only-testing:SourceReadSwiftTests/SourceVariablePersistenceTests \
            -only-testing:SourceReadSwiftTests/SourceScriptCacheTests \
            -only-testing:SourceReadSwiftTests/SourceEngineScriptCacheTests \
            -only-testing:SourceReadSwiftTests/SourceLoginCacheCompatibilityTests \
            -only-testing:SourceReadSwiftTests/SourceScriptHeaderResolverTests \
            -only-testing:SourceReadSwiftTests/SourceEngineScriptHeaderTests \
            -only-testing:SourceReadSwiftTests/SourceImageRequestHeadersTests \
            -only-testing:SourceReadSwiftTests/ComicImageCookieBoundaryTests \
            -only-testing:SourceReadSwiftTests/SourcePreflightEvidenceTests \
            -only-testing:SourceReadSwiftTests/SourceAndroidBridgeCompatibilityTests \
            -only-testing:SourceReadSwiftTests/SourceCookieStoreTests \
            -only-testing:SourceReadSwiftTests/SourceLoginSessionTests \
            -only-testing:SourceReadSwiftTests/SourceBrowserLoginCoordinatorTests \
            -only-testing:SourceReadSwiftTests/SourceBrowserResponseTests \
            -only-testing:SourceReadSwiftTests/SourceBrowserCookieSnapshotTests \
            -only-testing:SourceReadSwiftTests/SourceScriptFreshCookieTests \
            -only-testing:SourceReadSwiftTests/SourceAuthoredCookieTests \
            -only-testing:SourceReadSwiftTests/SourceBrowserToSearchSessionTests \
            -only-testing:SourceReadSwiftTests/SourceImageByteCompatibilityTests \
            -only-testing:SourceReadSwiftTests/LegadoBitmapBridgeTests \
            -only-testing:SourceReadSwiftTests/SourceImageDecodePipelineTests \
            -only-testing:SourceReadSwiftTests/SourceDynamicMediaKindTests \
            -only-testing:SourceReadSwiftTests/BookDetailMediaRoutingTests \
            -only-testing:SourceReadSwiftTests/SourceDynamicSearchProjectionTests \
            -only-testing:SourceReadSwiftTests/SourceJavaScriptLibraryLoaderTests \
            -only-testing:SourceReadSwiftTests/SourceLoginFieldTests \
            -only-testing:SourceReadSwiftTests/SourceEnginePersistentStateTests \
            -only-testing:SourceReadSwiftTests/SourcePublisherLinksTests \
            -only-testing:SourceReadSwiftTests/ChapterContentCacheStoreTests \
            -only-testing:SourceReadSwiftTests/SourcePipelineTests \
            -only-testing:SourceReadSwiftTests/SourceFlowEngineTests \
            -only-testing:SourceReadSwiftTests/SourceDiagnosticReportExporterTests \
            -only-testing:SourceReadSwiftTests/SourceURLDirectiveTests \
            -only-testing:SourceReadSwiftTests/SourceRequestTransportTests \
            test-without-building 2>&1 | tee parser-test.log

      - name: Upload parser regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-parser-regression
          path: |
            parser-test.log
            probe-build.log
          if-no-files-found: warn

      - name: Run offline corpus probes
        if: ${{ !cancelled() && steps.probe-simulator.outcome == 'success' }}
        env:
          DEVICE_ID: ${{ steps.probe-simulator.outputs.device }}
        run: |
          set -euo pipefail
          TEST_RUNNER_ROWS_PROBE_OUTPUT="$RUNNER_TEMP/rows-probe.json" \
          TEST_RUNNER_TOC_PROBE_OUTPUT="$RUNNER_TEMP/toc-probe.json" \
          TEST_RUNNER_SEARCH_URL_PROBE_OUTPUT="$RUNNER_TEMP/search-url-probe.json" \
          xcodebuild \
            -project SourceReadSwift.xcodeproj \
            -scheme SourceReadSwift \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO \
            -only-testing:SourceReadSwiftTests/SourceRowsCorpusProbeTests \
            -only-testing:SourceReadSwiftTests/SourceTocCorpusProbeTests \
            -only-testing:SourceReadSwiftTests/SourceSearchURLProbeTests \
            test-without-building 2>&1 | tee probe-test.log

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rows-probe
          path: |
            probe-test.log
            ${{ runner.temp }}/rows-probe.json
            ${{ runner.temp }}/toc-probe.json
            ${{ runner.temp }}/search-url-probe.json
          if-no-files-found: warn
