name: Atelier Theme Verification
run-name: "SourceRead · 七组主题重做与原主页保护 · #${{ github.run_number }}"
on:
  workflow_dispatch:
concurrency:
  group: atelier-redesign-${{ github.ref }}
  cancel-in-progress: false
jobs:
  themes:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        runtime: ['26', '18']
    runs-on: ${{ matrix.runtime == '26' && 'macos-26' || 'macos-15' }}
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: ${{ matrix.runtime == '26' && '/Applications/Xcode_26.2.app/Contents/Developer' || '/Applications/Xcode_16.4.app/Contents/Developer' }}
      DIAGNOSTIC_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v5
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Boot simulator
        run: |
          set -euo pipefail
          RUNTIME_ID="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys,os; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["version"].startswith(os.environ["DIAGNOSTIC_RUNTIME"]+".")))')"
          python3 -u scripts/boot_native_simulator.py "$RUNTIME_ID" --output atelier-device.txt
      - name: Compile app and tests
        id: build
        run: |
          set -euo pipefail
          xcodebuild -project SourceReadSwift.xcodeproj -scheme SourceReadSwift -destination "id=$(cat atelier-device.txt)" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO build-for-testing 2>&1 | tee atelier-build.log
      - name: Verify themes, compact layouts and glass preservation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          set -euo pipefail
          xcodebuild -project SourceReadSwift.xcodeproj -scheme SourceReadSwift -destination "id=$(cat atelier-device.txt)" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO \
            -only-testing:SourceReadSwiftTests/AtelierThemeTests \
            -only-testing:SourceReadSwiftTests/AtelierLayoutTests \
            -only-testing:SourceReadSwiftTests/HomeLayoutEvidenceTests \
            -only-testing:SourceReadSwiftTests/RootTabGlassTests \
            -only-testing:SourceReadSwiftTests/TabChromeRegressionTests \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 60 \
            -resultBundlePath AtelierUnit.xcresult test-without-building 2>&1 | tee atelier-unit.log
      - name: Publish early theme results
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: atelier-unit-${{ github.sha }}-ios${{ matrix.runtime }}
          path: atelier-unit.log
          if-no-files-found: error
          retention-days: 7
      - name: Verify actual theme homes, paging and global search
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          set -euo pipefail
          xcodebuild -project SourceReadSwift.xcodeproj -scheme SourceReadSwift -destination "id=$(cat atelier-device.txt)" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO \
            -only-testing:SourceReadSwiftUITests/AtelierHomeUITests \
            -only-testing:SourceReadSwiftUITests/RootTabGlassUITests \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testHomeGlobalSearchOnlyFindsAppFunctions \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180 \
            -resultBundlePath AtelierUI.xcresult test-without-building 2>&1 | tee atelier-ui.log
      - name: Export window and real home screenshots
        if: always()
        run: |
          if [ -d AtelierUnit.xcresult ]; then
            xcrun xcresulttool export attachments --path AtelierUnit.xcresult --output-path atelier-snapshots/unit
          fi
          if [ -d AtelierUI.xcresult ]; then
            xcrun xcresulttool export attachments --path AtelierUI.xcresult --output-path atelier-snapshots/ui
          fi
      - name: Preserve results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-${{ github.sha }}-ios${{ matrix.runtime }}
          path: |
            atelier-*.log
            AtelierUnit.xcresult
            AtelierUI.xcresult
            atelier-snapshots
          retention-days: 7
