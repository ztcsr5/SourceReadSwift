name: iOS

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/**
      - codex/**
      - native/**
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  native-tabs:
    runs-on: ${{ github.ref == 'refs/heads/codex/reader-motion-117' && 'macos-26-intel' || 'macos-26' }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: iOS26 native tab runtime regression
        timeout-minutes: 35
        run: |
          set -euo pipefail
          RUNTIME_ID="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["version"].startswith("26.")))')"
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((v["udid"] for v in d["devices"].get(sys.argv[1],[]) if v.get("isAvailable") and "iPhone" in v["name"]),""))' "$RUNTIME_ID")"
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID="$(xcrun simctl create PaperTabChrome com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$RUNTIME_ID")"
          fi
          echo "Native tab runtime: $RUNTIME_ID / $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          open -a Simulator --args -CurrentDeviceUDID "$DEVICE_ID"
          python3 -u -c 'import subprocess,sys; subprocess.run(["xcrun","simctl","bootstatus",sys.argv[1],"-b"],check=True,timeout=180)' "$DEVICE_ID" 2>&1 | tee native-boot.log
          xcodebuild -project SourceReadSwift.xcodeproj -scheme SourceReadSwift \
            -destination "id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -only-testing:SourceReadSwiftTests/TabChromeRegressionTests \
            -only-testing:SourceReadSwiftTests/ReaderCoverTeardownTests \
            -only-testing:SourceReadSwiftTests/AppLayoutDensityTests \
            -only-testing:SourceReadSwiftTests/SourceOrganizationTests \
            -only-testing:SourceReadSwiftTests/ReaderTocPerformanceTests \
            -only-testing:SourceReadSwiftTests/ContentImagePipelineRegressionTests \
            -only-testing:SourceReadSwiftTests/RemoteComicImageTests \
            -only-testing:SourceReadSwiftTests/AppFrameProfilerTests \
            -only-testing:SourceReadSwiftTests/Release116VisualTests \
            -only-testing:SourceReadSwiftTests/ReaderModePositionRegressionTests \
            -only-testing:SourceReadSwiftTests/Release117DetailTests \
            -only-testing:SourceReadSwiftTests/Release117ComicCompatibilityTests \
            -only-testing:SourceReadSwiftTests/Release117AppearanceTests \
            -only-testing:SourceReadSwiftTests/Release117SearchProjectionTests \
            -only-testing:SourceReadSwiftTests/Release117ChromeTests \
            -only-testing:SourceReadSwiftTests/WebsiteSourceInferenceTests \
            -only-testing:SourceReadSwiftTests/WebsiteSourceFamilyInferenceTests \
            -only-testing:SourceReadSwiftTests/AIChatTests \
            -only-testing:SourceReadSwiftTests/Release117PurificationTests \
            -only-testing:SourceReadSwiftTests/LANWorkbenchTests \
            -only-testing:SourceReadSwiftTests/ReadingNotesNavigationTests \
            -only-testing:SourceReadSwiftTests/Release117ThemeCollaborationTests \
            -only-testing:SourceReadSwiftTests/Release117ReaderPersonalizationTests \
            -only-testing:SourceReadSwiftTests/Release117WallpaperEditorTests \
            -only-testing:SourceReadSwiftTests/Release117ReadingHeroTests \
            -only-testing:SourceReadSwiftTests/Release117MotionSystemTests \
            -only-testing:SourceReadSwiftTests/Release117PolishTests \
            -only-testing:SourceReadSwiftTests/ReaderSettingsStackTests \
            -only-testing:SourceReadSwiftTests/ReaderPanController119Tests \
            -destination-timeout 120 -test-timeouts-enabled YES -maximum-test-execution-time-allowance 60 \
            -resultBundlePath NativeTabResults.xcresult test 2>&1 | tee native-tab-test.log
      - name: Export iOS26 attachments
        if: always()
        run: |
          if [ -d NativeTabResults.xcresult ]; then
            xcrun xcresulttool export attachments --path NativeTabResults.xcresult --output-path native-ui-snapshots
          fi
      - name: Preserve iOS26 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios26-tab-evidence-${{ github.sha }}
          path: |
            native-tab-test.log
            native-boot.log
            NativeTabResults.xcresult
            native-ui-snapshots
          retention-days: 7
      - name: Preserve compact iOS26 UI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios26-ui-snapshots-${{ github.sha }}
          path: native-ui-snapshots
          if-no-files-found: ignore
          retention-days: 7
  build:
    runs-on: ${{ github.ref == 'refs/heads/codex/reader-motion-117' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project SourceReadSwift.xcodeproj \
            -scheme SourceReadSwift \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild-build.log

      - name: Summarize build failure
        if: failure()
        run: |
          if [ -f xcodebuild-build.log ]; then
            grep -E "error:|fatal error:" xcodebuild-build.log | tail -n 80 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 220 xcodebuild-build.log
          fi

      - name: Test
        env:
          TEST_RUNNER_COMIC_CORPUS_PROBE: "1"
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          xcodebuild \
            -project SourceReadSwift.xcodeproj \
            -scheme SourceReadSwift \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            test 2>&1 | tee xcodebuild-test.log
      - name: Export test attachments
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path ui-snapshots
          fi

      - name: Summarize test failure
        if: failure()
        run: |
          if [ -f xcodebuild-test.log ]; then
            grep -E "error:|fatal error:|failed:" xcodebuild-test.log | tail -n 80 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 220 xcodebuild-test.log
          fi

      - name: Summarize test run
        if: success()
        run: |
          echo "## iOS XCTest" >> "$GITHUB_STEP_SUMMARY"
          echo "- simulator build and XCTest completed successfully" >> "$GITHUB_STEP_SUMMARY"
          if [ -f xcodebuild-test.log ]; then
            grep -E "Test Suite|Executed [0-9]+ tests" xcodebuild-test.log | tail -n 12 >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-evidence-${{ github.sha }}
          path: |
            xcodebuild-build.log
            xcodebuild-test.log
            TestResults.xcresult
            ui-snapshots
          retention-days: 7
      - name: Preserve compact UI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-snapshots-${{ github.sha }}
          path: ui-snapshots
          if-no-files-found: ignore
          retention-days: 7
