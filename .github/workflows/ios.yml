name: Root Tab Glass Verification
run-name: "SourceRead · 底栏玻璃与主页搜索专项 · #${{ github.run_number }}"
on:
  workflow_dispatch:
concurrency:
  group: root-tab-glass-${{ github.ref }}
  cancel-in-progress: false
jobs:
  glass:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        runtime: ['26', '18']
    runs-on: ${{ matrix.runtime == '26' && 'macos-26' || 'macos-15' }}
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: ${{ matrix.runtime == '26' && '/Applications/Xcode_26.2.app/Contents/Developer' || '/Applications/Xcode_16.4.app/Contents/Developer' }}
      DIAGNOSTIC_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v5
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Boot simulator
        run: |
          set -euo pipefail
          RUNTIME_ID="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys,os; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["version"].startswith(os.environ["DIAGNOSTIC_RUNTIME"]+".")))')"
          python3 -u scripts/boot_native_simulator.py "$RUNTIME_ID" --output tab-glass-device.txt
      - name: Compile app and tests
        id: build
        run: |
          set -euo pipefail
          xcodebuild -project SourceReadSwift.xcodeproj -scheme SourceReadSwift -destination "id=$(cat tab-glass-device.txt)" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO build-for-testing 2>&1 | tee tab-glass-build.log
      - name: Verify material pixels and unique tab ownership
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          set -euo pipefail
          xcodebuild -project SourceReadSwift.xcodeproj -scheme SourceReadSwift -destination "id=$(cat tab-glass-device.txt)" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO \
            -only-testing:SourceReadSwiftTests/RootTabGlassTests \
            -only-testing:SourceReadSwiftTests/TabChromeRegressionTests \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 60 \
            -resultBundlePath TabGlassUnit.xcresult test-without-building 2>&1 | tee tab-glass-unit.log
      - name: Publish early material results
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: tab-glass-unit-${{ github.sha }}-ios${{ matrix.runtime }}
          path: tab-glass-unit.log
          if-no-files-found: error
          retention-days: 7
      - name: Verify real home glass and global search
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          set -euo pipefail
          xcodebuild -project SourceReadSwift.xcodeproj -scheme SourceReadSwift -destination "id=$(cat tab-glass-device.txt)" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO \
            -only-testing:SourceReadSwiftUITests/RootTabGlassUITests \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testHomeGlobalSearchFindsTheLocalBookAndOpensItsDetails \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180 \
            -resultBundlePath TabGlassUI.xcresult test-without-building 2>&1 | tee tab-glass-ui.log
      - name: Export window and real home screenshots
        if: always()
        run: |
          if [ -d TabGlassUnit.xcresult ]; then
            xcrun xcresulttool export attachments --path TabGlassUnit.xcresult --output-path tab-glass-snapshots/unit
          fi
          if [ -d TabGlassUI.xcresult ]; then
            xcrun xcresulttool export attachments --path TabGlassUI.xcresult --output-path tab-glass-snapshots/ui
          fi
      - name: Preserve results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tab-glass-${{ github.sha }}-ios${{ matrix.runtime }}
          path: |
            tab-glass-*.log
            TabGlassUnit.xcresult
            TabGlassUI.xcresult
            tab-glass-snapshots
          retention-days: 7
