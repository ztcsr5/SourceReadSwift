name: Reader system-pop diagnostics (not IPA validation)
'on':
  workflow_dispatch: {}
jobs:
  reader-system-pop:
    runs-on: macos-26
    timeout-minutes: 38
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      DIAGNOSTIC_RUNTIME: '26'
    steps:
    - uses: actions/checkout@v5
    - name: Generate project
      run: 'set -euo pipefail

        brew install xcodegen

        xcodegen generate

        '
    - name: Boot diagnostic simulator
      timeout-minutes: 20
      run: 'set -euo pipefail

        RUNTIME_ID="$(xcrun simctl list runtimes -j | python3 -c ''import json,sys,os; print(next(r["identifier"] for r in
        json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["version"].startswith(os.environ["DIAGNOSTIC_RUNTIME"]+".")))'')"

        python3 -u scripts/boot_native_simulator.py "$RUNTIME_ID" --output diagnostic-device.txt 2>&1 | tee diagnostic-boot.log

        '
    - name: Compile app and tests
      id: build
      timeout-minutes: 20
      run: 'set -euo pipefail

        DEVICE_ID="$(cat diagnostic-device.txt)"

        xcodebuild -project SourceReadSwift.xcodeproj -scheme SourceReadSwift -destination "id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO
        -parallel-testing-enabled NO build-for-testing 2>&1 | tee diagnostic-build.log

        '
    - name: Test reader system pop and retained destinations
      timeout-minutes: 13
      run: 'set -euo pipefail

        DEVICE_ID="$(cat diagnostic-device.txt)"

        xcodebuild -project SourceReadSwift.xcodeproj -scheme SourceReadSwift -destination "id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO   -parallel-testing-enabled
        NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180   -only-testing:SourceReadSwiftTests/ReaderExitSwipeTests/testProsePrioritizesOnlyTheMountedNavigationEdgeRecognizer   -only-testing:SourceReadSwiftTests/ReaderExitSwipeTests/testProseEdgePriorityInstallsWhenItsParentIsMountedLater   -only-testing:SourceReadSwiftTests/ReaderNativeNavigationTests/testRealReaderPushAndPopRetainTheRootAndDoNotOwnTabChrome   -only-testing:SourceReadSwiftTests/ReaderNativeNavigationTests/testReaderOpenedFromASheetReturnsToThatSameSheet   -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testReaderSystemReturnCanCancelWithoutLosingItsSavedParagraph   -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testReaderFastNativeReturnCompletesFromProse   -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testReaderReturnPreservesScrolledShelfAndSettingsStack   -resultBundlePath
        ReaderSystemPop.xcresult test-without-building 2>&1 | tee diagnostic-return.log

        '
    - name: Preserve reader diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reader-system-pop-${{ github.sha }}
        path: 'diagnostic-*.log

          ReaderSystemPop.xcresult'
        retention-days: 7
