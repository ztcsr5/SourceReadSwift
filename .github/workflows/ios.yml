name: iOS
run-name: "SourceRead 1.1.7 · Build 136 · iOS 完整验证 · #${{ github.run_number }}"

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      reader_settings_only:
        description: Run the real reader settings UI reproduction without packaging
        type: boolean
        default: false
  push:
    branches:
      - main
      - feat/**
      - codex/**
      - native/**
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  native-tabs:
    if: github.ref != 'refs/heads/codex/floating-reading-desk'
    runs-on: ${{ (github.ref == 'refs/heads/codex/reader-motion-117' || inputs.reader_settings_only) && 'macos-26-intel' || 'macos-26' }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Boot iOS26 simulator
        timeout-minutes: 25
        run: |
          set -euo pipefail
          RUNTIME_ID="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["version"].startswith("26.")))')"
          python3 -u scripts/boot_native_simulator.py "$RUNTIME_ID" --output native-device-id.txt 2>&1 | tee native-boot.log
      - name: Build iOS26 tests
        timeout-minutes: 35
        run: |
          set -euo pipefail
          DEVICE_ID="$(cat native-device-id.txt)"
          xcodebuild -project SourceReadSwift.xcodeproj -scheme SourceReadSwift \
            -destination "id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO build-for-testing 2>&1 | tee native-build.log
      - name: iOS26 native tab runtime regression
        if: ${{ !inputs.reader_settings_only }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          DEVICE_ID="$(cat native-device-id.txt)"
          xcodebuild -project SourceReadSwift.xcodeproj -scheme SourceReadSwift \
            -destination "id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -only-testing:SourceReadSwiftTests/TabChromeRegressionTests \
            -only-testing:SourceReadSwiftTests/ReaderCoverTeardownTests \
            -only-testing:SourceReadSwiftTests/AppLayoutDensityTests \
            -only-testing:SourceReadSwiftTests/SourceOrganizationTests \
            -only-testing:SourceReadSwiftTests/ReaderTocPerformanceTests \
            -only-testing:SourceReadSwiftTests/ContentImagePipelineRegressionTests \
            -only-testing:SourceReadSwiftTests/RemoteComicImageTests \
            -only-testing:SourceReadSwiftTests/AppFrameProfilerTests \
            -only-testing:SourceReadSwiftTests/Release116VisualTests \
            -only-testing:SourceReadSwiftTests/ReaderModePositionRegressionTests \
            -only-testing:SourceReadSwiftTests/Release117DetailTests \
            -only-testing:SourceReadSwiftTests/Release117ComicCompatibilityTests \
            -only-testing:SourceReadSwiftTests/Release117AppearanceTests \
            -only-testing:SourceReadSwiftTests/Release117SearchProjectionTests \
            -only-testing:SourceReadSwiftTests/Release117ChromeTests \
            -only-testing:SourceReadSwiftTests/WebsiteSourceInferenceTests \
            -only-testing:SourceReadSwiftTests/WebsiteSourceFamilyInferenceTests \
            -only-testing:SourceReadSwiftTests/AIChatTests \
            -only-testing:SourceReadSwiftTests/Release117PurificationTests \
            -only-testing:SourceReadSwiftTests/LANWorkbenchTests \
            -only-testing:SourceReadSwiftTests/ReadingNotesNavigationTests \
            -only-testing:SourceReadSwiftTests/Release117ThemeCollaborationTests \
            -only-testing:SourceReadSwiftTests/Release117ReaderPersonalizationTests \
            -only-testing:SourceReadSwiftTests/Release117WallpaperEditorTests \
            -only-testing:SourceReadSwiftTests/Release117ReadingHeroTests \
            -only-testing:SourceReadSwiftTests/Release117MotionSystemTests \
            -only-testing:SourceReadSwiftTests/Release117PolishTests \
            -only-testing:SourceReadSwiftTests/ReaderSettingsStackTests \
            -only-testing:SourceReadSwiftTests/FontImportRequestTests \
            -only-testing:SourceReadSwiftTests/ReaderScrollCadenceTests \
            -only-testing:SourceReadSwiftTests/ReaderBindingTests \
            -only-testing:SourceReadSwiftTests/ReaderWorkbenchVisualTests \
            -only-testing:SourceReadSwiftTests/ReaderControlsMaterialTests \
            -only-testing:SourceReadSwiftTests/ReaderTabChromeExitTests \
            -only-testing:SourceReadSwiftTests/ReaderPanController119Tests \
            -destination-timeout 120 -test-timeouts-enabled YES -maximum-test-execution-time-allowance 60 \
            -resultBundlePath NativeTabResults.xcresult test-without-building 2>&1 | tee native-tab-test.log
      - name: Exercise real reader settings UI on iOS26
        timeout-minutes: 15
        run: |
          set -euo pipefail
          DEVICE_ID="$(cat native-device-id.txt)"
          xcodebuild -project SourceReadSwift.xcodeproj -scheme SourceReadSwift \
            -destination "id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -only-testing:SourceReadSwiftUITests/ReaderSettingsFlowUITests \
            -destination-timeout 120 -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180 \
            -resultBundlePath NativeReaderUIResults.xcresult test-without-building 2>&1 | tee native-reader-ui-test.log
      - name: Export iOS26 attachments
        if: always()
        run: |
          if [ -d NativeTabResults.xcresult ]; then
            xcrun xcresulttool export attachments --path NativeTabResults.xcresult --output-path native-ui-snapshots/unit
          fi
          if [ -d NativeReaderUIResults.xcresult ]; then
            xcrun xcresulttool export attachments --path NativeReaderUIResults.xcresult --output-path native-ui-snapshots/reader
          fi
      - name: Preserve iOS26 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios26-tab-evidence-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            native-tab-test.log
            native-build.log
            native-reader-ui-test.log
            native-boot.log
            NativeTabResults.xcresult
            NativeReaderUIResults.xcresult
            native-ui-snapshots
          retention-days: 7
      - name: Preserve compact iOS26 UI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios26-ui-snapshots-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: native-ui-snapshots
          if-no-files-found: ignore
          retention-days: 7
  build:
    if: github.ref != 'refs/heads/codex/floating-reading-desk'
    runs-on: ${{ (github.ref == 'refs/heads/codex/reader-motion-117' || inputs.reader_settings_only) && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project SourceReadSwift.xcodeproj \
            -scheme SourceReadSwift \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild-build.log

      - name: Summarize build failure
        if: failure()
        run: |
          if [ -f xcodebuild-build.log ]; then
            grep -E "error:|fatal error:" xcodebuild-build.log | tail -n 80 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 220 xcodebuild-build.log
          fi

      - name: Test
        env:
          TEST_RUNNER_COMIC_CORPUS_PROBE: "1"
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          TEST_SELECTION=(-only-testing:SourceReadSwiftTests -only-testing:SourceReadSwiftUITests)
          if [ "${{ inputs.reader_settings_only }}" = "true" ]; then
            TEST_SELECTION=(-only-testing:SourceReadSwiftUITests/ReaderSettingsFlowUITests)
          fi
          xcrun simctl spawn "$DEVICE_ID" log stream --level info --style compact \
            --predicate 'subsystem == "com.edc21.SourceReadSwift.book-passage"' > reader-startup.log 2>&1 &
          LOG_PID=$!
          trap 'kill "$LOG_PID" 2>/dev/null || true; wait "$LOG_PID" || true' EXIT
          xcodebuild \
            -project SourceReadSwift.xcodeproj \
            -scheme SourceReadSwift \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO \
            "${TEST_SELECTION[@]}" \
            -resultBundlePath TestResults.xcresult \
            test 2>&1 | tee xcodebuild-test.log
      - name: Export test attachments
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path ui-snapshots
          fi

      - name: Summarize test failure
        if: failure()
        run: |
          if [ -f xcodebuild-test.log ]; then
            grep -E "error:|fatal error:|failed:" xcodebuild-test.log | tail -n 80 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 220 xcodebuild-test.log
          fi

      - name: Summarize test run
        if: success()
        run: |
          echo "## iOS XCTest" >> "$GITHUB_STEP_SUMMARY"
          echo "- simulator build and XCTest completed successfully" >> "$GITHUB_STEP_SUMMARY"
          if [ -f xcodebuild-test.log ]; then
            grep -E "Test Suite|Executed [0-9]+ tests" xcodebuild-test.log | tail -n 12 >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-evidence-${{ github.sha }}
          path: |
            xcodebuild-build.log
            xcodebuild-test.log
            reader-startup.log
            TestResults.xcresult
            ui-snapshots
          retention-days: 7
      - name: Preserve compact UI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-snapshots-${{ github.sha }}
          path: ui-snapshots
          if-no-files-found: ignore
          retention-days: 7
