name: Reader Failure Diagnostics
run-name: "SourceRead 1.1.8 · Build 138 · 关键失败定向验证（非 IPA 门禁） · #${{ github.run_number }}"
on:
  workflow_dispatch:
concurrency:
  group: reader-diagnostics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused-ios26:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Boot diagnostic simulator
        timeout-minutes: 20
        run: |
          set -euo pipefail
          RUNTIME_ID="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["version"].startswith("26.")))')"
          python3 -u scripts/boot_native_simulator.py "$RUNTIME_ID" --output diagnostic-device.txt 2>&1 | tee diagnostic-boot.log
      - name: Compile app and tests
        id: build
        timeout-minutes: 20
        run: |
          set -euo pipefail
          DEVICE_ID="$(cat diagnostic-device.txt)"
          xcodebuild -project SourceReadSwift.xcodeproj -scheme SourceReadSwift -destination "id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO build-for-testing 2>&1 | tee diagnostic-build.log
      - name: Verify transport focus and return policies
        timeout-minutes: 8
        env:
          TEST_RUNNER_SOURCE_READ_COMIC_DIAGNOSTICS: "1"
        run: |
          set -euo pipefail
          DEVICE_ID="$(cat diagnostic-device.txt)"
          xcodebuild -project SourceReadSwift.xcodeproj -scheme SourceReadSwift -destination "id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO \
            -only-testing:SourceReadSwiftTests/RemoteComicImageTests \
            -only-testing:SourceReadSwiftTests/ReaderOpeningTransitionTests \
            -only-testing:SourceReadSwiftTests/Release117AppearanceTests \
            -only-testing:SourceReadSwiftTests/Release117MotionSystemTests \
            -only-testing:SourceReadSwiftTests/Release117ThemeCollaborationTests \
            -only-testing:SourceReadSwiftTests/Release117DetailTests \
            -only-testing:SourceReadSwiftTests/ReaderExitSwipeTests \
            -only-testing:SourceReadSwiftTests/GlobalSearchIndexTests \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 60 \
            -resultBundlePath DiagnosticUnit.xcresult test-without-building 2>&1 | tee diagnostic-unit.log
      - name: Publish unit feedback before UI
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: reader-diag-unit-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: diagnostic-unit.log
          if-no-files-found: error
          retention-days: 7
      - name: Verify the failed real navigation paths
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          set -euo pipefail
          DEVICE_ID="$(cat diagnostic-device.txt)"
          xcodebuild -project SourceReadSwift.xcodeproj -scheme SourceReadSwift -destination "id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testHomeGlobalSearchFindsTheLocalBookAndOpensItsDetails \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testFirstDetailEdgeReturnRestoresInteractiveHomeAndOnlyOneTabBar \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testFirstReadingOpensProseAndLaterResumesDirectly \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testCollapsedShelfFiltersPreserveQueryAndThemeLayoutsHaveRealEntries \
            -only-testing:SourceReadSwiftUITests/ReaderSettingsFlowUITests/testSearchPreviewOpensDirectlyAndOffersToKeepReadingPositionOnExit \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testReaderLongEdgeReturnCompletesWithReducedMotion \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testReaderSystemReturnCanCancelWithoutLosingItsSavedParagraph \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testReaderSystemReturnCanCancelWithReducedMotion \
            -only-testing:SourceReadSwiftUITests/FloatingReadingDeskUITests/testContinuousChapterCrossingKeepsProseHeadingAndReopenedPositionTogether \
            -only-testing:SourceReadSwiftUITests/ComicPagingBoundaryUITests \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180 \
            -resultBundlePath DiagnosticUI.xcresult test-without-building 2>&1 | tee diagnostic-ui.log
      - name: Export diagnostic attachments
        if: always()
        run: |
          if [ -d DiagnosticUnit.xcresult ]; then
            xcrun xcresulttool export attachments --path DiagnosticUnit.xcresult --output-path diagnostic-snapshots/unit
          fi
          if [ -d DiagnosticUI.xcresult ]; then
            xcrun xcresulttool export attachments --path DiagnosticUI.xcresult --output-path diagnostic-snapshots/ui
          fi
      - name: Preserve diagnostic logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-diagnostics-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            diagnostic-*.log
            DiagnosticUnit.xcresult
            DiagnosticUI.xcresult
          retention-days: 7
      - name: Preserve compact visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios26-ui-snapshots-${{ github.sha }}-diagnostics-attempt${{ github.run_attempt }}
          path: diagnostic-snapshots
          retention-days: 7
