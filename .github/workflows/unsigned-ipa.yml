name: Unsigned IPA

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - codex/**

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          set -euo pipefail
          xcodebuild \
            -project SourceReadSwift.xcodeproj \
            -scheme SourceReadSwift \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild-package.log

      - name: Summarize package failure
        if: failure()
        run: |
          if [ -f xcodebuild-package.log ]; then
            grep -E "error:|fatal error:" xcodebuild-package.log | tail -n 80 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 220 xcodebuild-package.log
          fi

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Release-iphoneos/SourceReadSwift.app' -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "SourceReadSwift.app not found"
            find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/*' -maxdepth 1 -type d
            exit 1
          fi
          rm -rf unsigned-ipa
          mkdir -p unsigned-ipa/Payload
          cp -R "$APP_PATH" unsigned-ipa/Payload/
          ditto -c -k --keepParent unsigned-ipa/Payload SourceReadSwift-unsigned.ipa
          cp SourceReadSwift-unsigned.ipa SourceReadSwift-1.0.0-unsigned.ipa
          ls -lh SourceReadSwift*.ipa

      - name: Summarize IPA artifact
        run: |
          set -euo pipefail
          SIZE_BYTES="$(stat -f%z SourceReadSwift-unsigned.ipa)"
          SHA256="$(shasum -a 256 SourceReadSwift-unsigned.ipa | awk '{print $1}')"
          echo "IPA size: ${SIZE_BYTES} bytes"
          echo "IPA SHA-256: ${SHA256}"
          {
            echo "## Unsigned IPA (v1.0.0)"
            echo "- file: `SourceReadSwift-1.0.0-unsigned.ipa`"
            echo "- alias: `SourceReadSwift-unsigned.ipa`"
            echo "- size: ${SIZE_BYTES} bytes"
            echo "- SHA-256: `${SHA256}`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SourceReadSwift-unsigned-ipa
          path: |
            SourceReadSwift-unsigned.ipa
            SourceReadSwift-1.0.0-unsigned.ipa
          if-no-files-found: error
