name: Unsigned IPA
run-name: "SourceRead 1.1.7 · Build 136 · IPA 未签名测试包 · #${{ github.run_number }}"

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - codex/**

jobs:
  package:
    if: github.ref != 'refs/heads/codex/floating-reading-desk'
    runs-on: ${{ github.ref == 'refs/heads/codex/reader-motion-117' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          set -euo pipefail
          xcodebuild \
            -project SourceReadSwift.xcodeproj \
            -scheme SourceReadSwift \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            build 2>&1 | tee xcodebuild-package.log

      - name: Summarize package failure
        if: failure()
        run: |
          if [ -f xcodebuild-package.log ]; then
            grep -E "error:|fatal error:" xcodebuild-package.log | tail -n 80 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 220 xcodebuild-package.log
          fi

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Release-iphoneos/SourceReadSwift.app' -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "SourceReadSwift.app not found"
            find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/*' -maxdepth 1 -type d
            exit 1
          fi
          rm -rf unsigned-ipa
          mkdir -p unsigned-ipa/Payload
          cp -R "$APP_PATH" unsigned-ipa/Payload/
          DSYM_PATH="${APP_PATH}.dSYM"
          if [ ! -d "$DSYM_PATH" ]; then
            echo "::error::Matching device dSYM not found beside the built app"
            exit 1
          fi
          ditto -c -k --keepParent "$DSYM_PATH" SourceReadSwift-device-symbols.zip
          VERSION="$(grep 'MARKETING_VERSION:' project.yml | awk '{print $2}' | tr -d '\"')"
          BUILD="$(grep 'CURRENT_PROJECT_VERSION:' project.yml | awk '{print $2}' | tr -d '\"')"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "Packaging version: ${VERSION} / Build ${BUILD} / ${SHORT_SHA}"
          ditto -c -k --keepParent unsigned-ipa/Payload "SourceReadSwift-${VERSION}-build${BUILD}-${SHORT_SHA}-unsigned.ipa"
          ls -lh SourceReadSwift*.ipa

      - name: Summarize IPA artifact
        run: |
          set -euo pipefail
          VERSION="$(grep 'MARKETING_VERSION:' project.yml | awk '{print $2}' | tr -d '\"')"
          BUILD="$(grep 'CURRENT_PROJECT_VERSION:' project.yml | awk '{print $2}' | tr -d '\"')"
          PLIST="unsigned-ipa/Payload/SourceReadSwift.app/Info.plist"
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          PLIST_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          echo "Plist version: ${PLIST_VERSION} (${PLIST_BUILD})"
          if [ "$PLIST_VERSION" != "$VERSION" ] || [ "$PLIST_BUILD" != "$BUILD" ]; then
            echo "::error::Version drift: Info.plist=${PLIST_VERSION} (${PLIST_BUILD}) project.yml=${VERSION} (${BUILD})"
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA:0:7}"
          IPA_NAME="SourceReadSwift-${VERSION}-build${BUILD}-${SHORT_SHA}-unsigned.ipa"
          SIZE_BYTES="$(stat -f%z "$IPA_NAME")"
          SHA256="$(shasum -a 256 "$IPA_NAME" | awk '{print $1}')"
          echo "IPA size: ${SIZE_BYTES} bytes"
          echo "IPA SHA-256: ${SHA256}"
          {
            echo "## SourceRead ${VERSION} / Build ${BUILD} / unsigned"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- file: \`$IPA_NAME\`"
            echo "- size: ${SIZE_BYTES} bytes"
            echo "- SHA-256: \`${SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SourceReadSwift-unsigned-ipa
          path: SourceReadSwift-*.ipa
          if-no-files-found: error

      - name: Preserve matching device symbols
        uses: actions/upload-artifact@v4
        with:
          name: SourceReadSwift-device-symbols-${{ github.sha }}
          path: SourceReadSwift-device-symbols.zip
          if-no-files-found: error
          retention-days: 30
