name: SourceReadSwift
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.8.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
  CryptoSwift:
    url: https://github.com/krzyzanowskim/CryptoSwift.git
    from: 1.9.0
targets:
  SourceReadSwift:
    type: application
    platform: iOS
    sources:
      - SourceReadSwift
    dependencies:
      - package: SwiftSoup
      - package: ZIPFoundation
      - package: CryptoSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edc21.SourceReadSwift
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: SourceReadSwift/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: SourceReadSwift/SourceReadSwift.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: SourceReadSwift/Core/Compression/ZlibBridge.h
        OTHER_LDFLAGS:
          - "-lz"
    info:
      path: SourceReadSwift/App/Info.plist
      properties:
        CFBundleDisplayName: 纸间
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Used to import, export and manage book sources on the local network.
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Readable text, EPUB and source JSON
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
              - public.text
              - public.plain-text
              - public.data
              - public.item
              - public.content
              - com.edc21.sourceread.source-json
              - org.idpf.epub-container
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.edc21.sourceread.source-json
            UTTypeDescription: SourceRead book source JSON or plain text
            UTTypeConformsTo:
              - public.json
              - public.text
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - json
                - txt
                - text
              public.mime-type:
                - application/json
                - text/plain
  SourceReadSwiftTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SourceReadSwiftTests
    resources:
      - SourceReadSwiftTests/Fixtures
    dependencies:
      - target: SourceReadSwift
      - package: SwiftSoup
      - package: ZIPFoundation
      - package: CryptoSwift
